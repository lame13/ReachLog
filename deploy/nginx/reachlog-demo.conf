# The published read-only demo, behind nginx instead of Caddy. Put this in
# /etc/nginx/conf.d/ and let the certificate tool fill in the TLS lines.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name reachlog-demo.example.com;

    ssl_certificate     /etc/letsencrypt/live/reachlog-demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reachlog-demo.example.com/privkey.pem;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # A demo is a window onto the product: nothing a visitor sends should be
        # cached by a proxy in front of it.
        proxy_cache_bypass $http_upgrade;
    }
}
